<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark plate so the mark holds up on light browser chrome too. -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- Four marks at widening intervals: the 3d / 1w / 2w / 1mo ladder.
       The first is full height because it is the one that is due.
       Bars are wider and the fade shallower than in the header mark: at
       16px a thin bar below ~45% opacity disappears into the plate. -->
  <rect x="4.5"  y="6"    width="4" height="20" rx="2" fill="#58a6ff"/>
  <rect x="10.4" y="10.5" width="4" height="11" rx="2" fill="#58a6ff" opacity="0.78"/>
  <rect x="16.7" y="10.5" width="4" height="11" rx="2" fill="#58a6ff" opacity="0.62"/>
  <rect x="23.5" y="10.5" width="4" height="11" rx="2" fill="#58a6ff" opacity="0.48"/>
</svg>
